services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chatroom
      MYSQL_USER: chatroom
      MYSQL_PASSWORD: chatroom
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      CHATROOM_MYSQL_DSN: "chatroom:chatroom@tcp(mysql:3306)/chatroom?parseTime=true&charset=utf8mb4"
      CHATROOM_REDIS_ADDR: "redis:6379"
      CHATROOM_JWT_SECRET: "dev-secret-change-me"
    ports:
      - "8080:8080"

  web:
    build: ../chatroom-web
    depends_on:
      - app
    ports:
      - "8081:80"
